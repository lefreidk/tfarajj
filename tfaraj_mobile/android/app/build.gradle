def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.tfaraj.app"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.tfaraj.app"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("CM_KEYSTORE_PATH")
            def ksPass = System.getenv("CM_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("CM_KEY_ALIAS")
            def ksKeyPass = System.getenv("CM_KEY_PASSWORD")

            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists() &&
                ksPass != null && !ksPass.trim().isEmpty() &&
                ksAlias != null && !ksAlias.trim().isEmpty() &&
                ksKeyPass != null && !ksKeyPass.trim().isEmpty()) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("CI") != null || System.getenv("CM_BUILD_DIR") != null) {
                def ksPath = System.getenv("CM_KEYSTORE_PATH")
                def ksPass = System.getenv("CM_KEYSTORE_PASSWORD")
                def ksAlias = System.getenv("CM_KEY_ALIAS")
                def ksKeyPass = System.getenv("CM_KEY_PASSWORD")

                def isInvalid = !ksPath?.trim() || !file(ksPath).exists() ||
                                !ksPass?.trim() ||
                                !ksAlias?.trim() ||
                                !ksKeyPass?.trim()

                if (isInvalid) {
                    throw new GradleException("ERROR: Release build failed in CI. Missing, empty, or whitespace-only Codemagic signing variables (CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD), or the keystore file does not exist at the specified path.")
                }
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
